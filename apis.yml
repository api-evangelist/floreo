aid: floreo
name: Floreo
description: Floreo is a research-based virtual reality (VR) digital therapeutics company
  that delivers immersive lessons teaching social, behavioral, communication, and life
  skills to neurodiverse individuals, including autistic children and adults. The platform
  runs across mobile (iPhone with Google Cardboard) and standalone VR headsets (Meta
  Quest 2/3/Pro, PICO), with a companion clinician portal for supervised sessions, progress
  tracking, and telehealth-style delivery. Floreo holds an FDA Breakthrough Device
  designation and participates in the FDA Total Product Life Cycle Advisory Program (TAP),
  and works with schools, behavioral-health providers, Medicaid programs, and research
  partners. It is tracked in the API Evangelist network as a portfolio company of Bloomberg
  Beta; the company publishes no public API, developer portal, or SDK at this time.
